name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Format check
        run: mise run format-check

      - name: Lint
        run: mise run lint

      - name: Unit tests
        run: mise run test-unit

      - name: Install Playwright browsers
        run: mise run playwright-install

      - name: E2E tests
        run: mise run test-e2e
