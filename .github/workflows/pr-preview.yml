name: PR Preview (AWS App Runner)

# Spins up a throwaway, seeded instance of the app for each pull request on a
# public HTTPS URL, then deletes it when the PR is merged or closed. See the
# "PR preview environments (AWS App Runner)" section of the README for the
# one-time AWS setup this workflow expects.
#
# Auth is via GitHub OIDC — there are NO long-lived AWS keys stored as secrets.
# All configuration lives in repository variables (Settings -> Secrets and
# variables -> Actions -> Variables); when AWS_DEPLOY_ROLE_ARN is unset the
# jobs are skipped, so the workflow is inert until you configure it.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One preview per PR; never run two deploys for the same PR at once.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required for AWS OIDC
  pull-requests: write   # required to post the preview URL comment

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'fintrack-preview' }}
  SERVICE_NAME: fintrack-pr-${{ github.event.number }}

jobs:
  deploy:
    # Build/deploy on open, reopen, and new commits — but not on close.
    if: ${{ github.event.action != 'closed' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:pr-${{ github.event.number }}-${GITHUB_SHA::7}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy to App Runner
        id: deploy
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          ACCESS_ROLE_ARN: ${{ vars.APPRUNNER_ACCESS_ROLE_ARN }}
          CPU: ${{ vars.APPRUNNER_CPU || '1024' }}
          MEMORY: ${{ vars.APPRUNNER_MEMORY || '2048' }}
        run: |
          set -euo pipefail

          # Container listens on 5003 and seeds a demo household on boot.
          cat > source-config.json <<JSON
          {
            "AuthenticationConfiguration": { "AccessRoleArn": "${ACCESS_ROLE_ARN}" },
            "AutoDeploymentsEnabled": false,
            "ImageRepository": {
              "ImageIdentifier": "${IMAGE_URI}",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "5003",
                "RuntimeEnvironmentVariables": {
                  "FINTRACK_PREVIEW_SEED": "1",
                  "FINTRACK_DB": "/app/data/fintrack.db"
                }
              }
            }
          }
          JSON

          ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${SERVICE_NAME}'].ServiceArn | [0]" \
            --output text)

          if [ "$ARN" = "None" ] || [ -z "$ARN" ]; then
            echo "Creating App Runner service ${SERVICE_NAME}"
            ARN=$(aws apprunner create-service \
              --service-name "$SERVICE_NAME" \
              --source-configuration file://source-config.json \
              --instance-configuration "Cpu=${CPU},Memory=${MEMORY}" \
              --health-check-configuration "Protocol=TCP,Interval=10,Timeout=5,HealthyThreshold=1,UnhealthyThreshold=5" \
              --query 'Service.ServiceArn' --output text)
          else
            echo "Updating existing App Runner service ${SERVICE_NAME}"
            aws apprunner update-service \
              --service-arn "$ARN" \
              --source-configuration file://source-config.json \
              --instance-configuration "Cpu=${CPU},Memory=${MEMORY}" >/dev/null
          fi

          echo "Waiting for service to reach RUNNING..."
          for _ in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$ARN" \
              --query 'Service.Status' --output text)
            echo "  status: $STATUS"
            case "$STATUS" in
              RUNNING) break ;;
              CREATE_FAILED|DELETE_FAILED|PAUSED)
                echo "::error::App Runner service entered state $STATUS"; exit 1 ;;
            esac
            sleep 15
          done

          URL=$(aws apprunner describe-service --service-arn "$ARN" \
            --query 'Service.ServiceUrl' --output text)
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: https://$URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- fintrack-preview -->';
            const body = `${marker}\n### 🚀 Preview environment ready\n\n` +
              `**${process.env.PREVIEW_URL}**\n\n` +
              `Seeded with an example household (snapshot **Example Household**). ` +
              `This instance is torn down automatically when the PR is merged or closed.\n\n` +
              `---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  teardown:
    # Delete the preview when the PR closes (merged or not).
    if: ${{ github.event.action == 'closed' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete App Runner service
        run: |
          set -euo pipefail
          ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${SERVICE_NAME}'].ServiceArn | [0]" \
            --output text)
          if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
            echo "Deleting App Runner service ${SERVICE_NAME}"
            aws apprunner delete-service --service-arn "$ARN" >/dev/null
          else
            echo "No App Runner service named ${SERVICE_NAME}; nothing to delete."
          fi

      - name: Delete preview images from ECR (best effort)
        continue-on-error: true
        run: |
          IDS=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --query "imageIds[?starts_with(imageTag, 'pr-${{ github.event.number }}-')]" \
            --output json)
          if [ "$IDS" != "[]" ] && [ -n "$IDS" ]; then
            aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" \
              --image-ids "$IDS" >/dev/null || true
          fi

      - name: Comment teardown on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- fintrack-preview -->';
            const body = `${marker}\n### 🧹 Preview environment torn down\n\n` +
              `The App Runner instance for this PR has been deleted.\n\n` +
              `---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
