name: PR Preview (AWS Lambda)

# Spins up a throwaway, seeded instance of the app for each pull request on a
# public HTTPS URL (Lambda Function URL), then deletes it when the PR is merged
# or closed. See docs/aws-preview-setup.md for the one-time AWS setup.
#
# Auth is via GitHub OIDC — there are NO long-lived AWS keys stored as secrets.
# All configuration lives in repository variables (Settings -> Secrets and
# variables -> Actions -> Variables); when AWS_DEPLOY_ROLE_ARN is unset the
# jobs are skipped, so the workflow is inert until you configure it.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One preview per PR; never run two deploys for the same PR at once.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required for AWS OIDC
  pull-requests: write   # required to post the preview URL comment

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'fintrack-preview' }}
  FUNCTION_NAME: fintrack-pr-${{ github.event.number }}
  STATIC_FUNCTION_NAME: fintrack-pr-${{ github.event.number }}-static
  # Cap on the public static function so a flood of requests can't run up
  # cost. A page loads ~12 static files in parallel; 20 leaves headroom.
  STATIC_RESERVED_CONCURRENCY: 20

jobs:
  deploy:
    # Build/deploy on open, reopen, and new commits — but not on close.
    if: ${{ github.event.action != 'closed' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Build and push Lambda image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:pr-${{ github.event.number }}-${GITHUB_SHA::7}"
          docker build -f Dockerfile.lambda -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy Lambda functions
        id: deploy
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          LAMBDA_ROLE_ARN: ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          # deploy() runs inside $(...); without this a failed step in it
          # wouldn't stop the job.
          shopt -s inherit_errexit

          # deploy NAME ENV_JSON RESERVED MEMORY
          # Create or update one function from the image, set its environment
          # and reserved concurrency, and make sure it has a public Function
          # URL. Prints the Function URL.
          deploy() {
            local name=$1 env_json=$2 reserved=$3 memory=$4
            if aws lambda get-function --function-name "$name" >/dev/null 2>&1; then
              echo "Updating Lambda function ${name}" >&2
              aws lambda update-function-code \
                --function-name "$name" \
                --image-uri "$IMAGE_URI" \
                --query 'FunctionArn' --output text >/dev/null
              aws lambda wait function-updated --function-name "$name"
              aws lambda update-function-configuration \
                --function-name "$name" \
                --environment "$env_json" \
                --query 'FunctionArn' --output text >/dev/null
              aws lambda wait function-updated --function-name "$name"
            else
              echo "Creating Lambda function ${name}" >&2
              aws lambda create-function \
                --function-name "$name" \
                --package-type Image \
                --code "ImageUri=${IMAGE_URI}" \
                --role "$LAMBDA_ROLE_ARN" \
                --memory-size "$memory" \
                --timeout 30 \
                --environment "$env_json" \
                --query 'FunctionArn' --output text >/dev/null
              aws lambda wait function-active --function-name "$name"
            fi

            # Every deploy, not only on create, so a changed value reaches
            # functions that already exist.
            aws lambda put-function-concurrency \
              --function-name "$name" \
              --reserved-concurrent-executions "$reserved" >/dev/null

            # Ensure Function URL exists (idempotent — skips if already configured)
            if ! aws lambda get-function-url-config --function-name "$name" >/dev/null 2>&1; then
              echo "Creating Function URL for ${name}..." >&2
              aws lambda create-function-url-config \
                --function-name "$name" \
                --auth-type NONE \
                --invoke-mode BUFFERED >/dev/null
              aws lambda add-permission \
                --function-name "$name" \
                --statement-id FunctionURLPublicAccess \
                --action lambda:InvokeFunctionUrl \
                --principal "*" \
                --function-url-auth-type NONE >/dev/null
              aws lambda add-permission \
                --function-name "$name" \
                --statement-id FunctionURLPublicInvoke \
                --action lambda:InvokeFunction \
                --principal "*" >/dev/null
            fi

            aws lambda get-function-url-config \
              --function-name "$name" \
              --query 'FunctionUrl' --output text
          }

          # Static files (scripts, CSS, icons) come from a second function
          # running the same image. It keeps no state, so it runs many copies
          # (up to STATIC_RESERVED_CONCURRENCY) and answers the page's parallel
          # requests at once; the app function below would 429 all but one.
          STATIC_URL=$(deploy "$STATIC_FUNCTION_NAME" \
            '{"Variables":{"FINTRACK_STATIC_ONLY":"1"}}' \
            "$STATIC_RESERVED_CONCURRENCY" 512)
          echo "Static URL: $STATIC_URL"

          # The app itself. Reserved concurrency 1 forces every request into
          # the same execution environment, so the ephemeral SQLite DB in
          # /tmp persists across requests.
          APP_ENV=$(jq -cn --arg static "${STATIC_URL%/}" \
            '{Variables: {FINTRACK_DB: "/tmp/fintrack.db", FINTRACK_STATIC_URL: $static}}')
          URL=$(deploy "$FUNCTION_NAME" "$APP_ENV" 1 1024)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- fintrack-preview -->';
            const body = `${marker}\n### 🚀 Preview environment ready\n\n` +
              `**${process.env.PREVIEW_URL}**\n\n` +
              `Seeded with demo households (snapshots **Dense**, **Sparse** and **Empty Household**). ` +
              `First load after idle may take a few seconds (cold start). ` +
              `This instance is torn down automatically when the PR is merged or closed.\n\n` +
              `---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  teardown:
    # Delete the preview when the PR closes (merged or not).
    if: ${{ github.event.action == 'closed' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete Lambda functions
        run: |
          set -euo pipefail
          for name in "$FUNCTION_NAME" "$STATIC_FUNCTION_NAME"; do
            if aws lambda get-function --function-name "$name" >/dev/null 2>&1; then
              echo "Deleting Lambda function ${name}"
              aws lambda delete-function --function-name "$name"
            else
              echo "No Lambda function named ${name}; nothing to delete."
            fi
          done

      # Lambda creates these on first invocation and never deletes them.
      # Best effort: needs logs:DeleteLogGroup (docs/aws-preview-setup.md).
      - name: Delete preview log groups (best effort)
        continue-on-error: true
        run: |
          for name in "$FUNCTION_NAME" "$STATIC_FUNCTION_NAME"; do
            group="/aws/lambda/${name}"
            if aws logs delete-log-group --log-group-name "$group" 2>err.txt; then
              echo "Deleted log group ${group}"
            elif grep -q ResourceNotFoundException err.txt; then
              echo "No log group ${group}; nothing to delete."
            else
              cat err.txt >&2
              echo "::warning::Couldn't delete ${group}; see docs/aws-preview-setup.md (logs:DeleteLogGroup)."
            fi
          done

      - name: Delete preview images from ECR (best effort)
        continue-on-error: true
        run: |
          PR_TAG_PREFIX="pr-${{ github.event.number }}-"
          IDS=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --query "imageIds[?imageTag != null && starts_with(imageTag, '${PR_TAG_PREFIX}')]" \
            --output json)
          if [ "$IDS" != "[]" ] && [ -n "$IDS" ]; then
            aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" \
              --image-ids "$IDS" >/dev/null || true
          fi

      - name: Comment teardown on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- fintrack-preview -->';
            const body = `${marker}\n### 🧹 Preview environment torn down\n\n` +
              `The Lambda preview for this PR has been deleted.\n\n` +
              `---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
