[tools]
uv = "latest"

[tasks.setup]
run = "uv sync"
description = "Install all dependencies into .venv"

[tasks.format]
run = "uv run ruff format fintrack/ web/ tests/ fintrack.py"
description = "Format code with ruff"

[tasks.format-check]
run = "uv run ruff format --check fintrack/ web/ tests/ fintrack.py"
description = "Check code formatting"

[tasks.lint]
run = "uv run ruff check fintrack/ web/ tests/ fintrack.py"
description = "Lint with ruff"

[tasks.lint-fix]
run = "uv run ruff check --fix fintrack/ web/ tests/ fintrack.py"
description = "Fix lint issues with ruff"

[tasks.test]
depends = ["format-check", "lint"]
run = [
    "uv run pytest tests/ -v --cov=fintrack --cov-report=term-missing -m 'not e2e'",
    "uv run pytest tests/ -v -m e2e",
]
description = "Run all CI checks (format, lint, unit, e2e for both apps)"

[tasks.test-unit]
run = "uv run pytest tests/ -v --cov=fintrack --cov-report=term-missing -m 'not e2e'"
description = "Run unit tests for both apps with coverage"

[tasks.test-e2e]
run = "uv run pytest tests/ -v -m e2e"
description = "Run e2e browser tests with Playwright (run playwright-install first)"

[tasks.playwright-install]
run = "uv run playwright install chromium"
description = "Install Playwright browser binaries"

[tasks.serve]
run = "uv run python -m web.app"
description = "Start the fintrack web server (port 5003)"
