{# Add row for budget — stub-then-edit: creates a default entry, user edits inline #}
<tr data-add-row>
    <td colspan="11" class="px-1.5 py-1 border-b border-gray-200 dark:border-gray-700">
        <span class="flex items-center gap-3">
            <button type="button" class="text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline"
                hx-post="{{ url_for('budget.add', filename=filename) }}" hx-vals='{"kind":"expense"}' hx-trigger="click" hx-swap="none">
                + Add expense
            </button>
            <button type="button" class="text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline"
                hx-post="{{ url_for('budget.add', filename=filename) }}" hx-vals='{"kind":"income"}' hx-trigger="click" hx-swap="none">
                + Add income
            </button>
        </span>
    </td>
</tr>
