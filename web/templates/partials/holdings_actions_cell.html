{# Holdings row actions cell (sticky to the right edge via #holdings-table CSS).
   Delete only for now — drag-to-reorder is deferred because accounts and asset
   entries are separate tables with independent sort orders. #}
<td class="table-actions-cell px-1.5 py-0.5 border-l border-gray-200 dark:border-gray-700 text-center align-middle bg-white dark:bg-gray-800">
    <span class="table-actions-inner">
        {% if edit_mode %}
        <button type="button" class="table-action-btn text-red-600 dark:text-red-400 shrink-0 hover:text-red-800 dark:hover:text-red-300 hover:bg-red-50 dark:hover:bg-red-900/30"
            title="Delete"
            hx-get="{{ url_for('holdings.delete_confirm', filename=filename, source=source, ref=ref) }}"
            hx-trigger="click" hx-swap="outerHTML" hx-target="closest td">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </button>
        {% endif %}
    </span>
</td>
